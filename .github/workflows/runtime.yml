name: Build and local media contract
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NAUGHTYBOX_DB_PASSWORD: ci-local-placeholder
      NAUGHTYBOX_MEDIA_SMOKE: '1'
      PLAYWRIGHT_USE_WEBSERVER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build existing applications
        run: npm run build:ci | tee evidence/runtime035-build-ci.txt
      - name: Domain and deployment contracts
        run: npm run test:units | tee evidence/runtime035-unit-ci.txt
      - run: npx playwright install --with-deps chromium
      - name: Synthetic local media server
        run: |
          docker network create dev-network
          docker compose -p naughtybox-runtime-ci -f infra/docker/docker-compose.yml up -d mediamtx
      - name: Real synthetic WebRTC to HLS playback
        run: node scripts/smoke-webrtc.mjs | tee evidence/runtime035-media-ci.txt
      - name: Existing mocked application workflows
        run: npm run test:e2e | tee evidence/runtime035-browser-ci.txt
      - name: Save media diagnostics
        if: always()
        run: docker compose -p naughtybox-runtime-ci -f infra/docker/docker-compose.yml logs mediamtx > evidence/runtime035-server-ci.txt
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: naughtybox-local-media
          path: |
            evidence/runtime035-*-ci.*
            test-results/
            playwright-report/
          retention-days: 14
