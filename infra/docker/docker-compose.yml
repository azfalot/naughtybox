name: naughtybox

# Naughtybox - phase 1 streaming stack
# Run from repo root: docker compose -f infra/docker/docker-compose.yml up --build

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [dev-network]

  mediamtx:
    image: bluenviron/mediamtx:1.17.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:1935:1935'
      - '127.0.0.1:8888:8888'
      - '127.0.0.1:8889:8889'
      - '127.0.0.1:8189:8189/udp'
      - '127.0.0.1:9997:9997'
      - '127.0.0.1:9998:9998'
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks: [dev-network]

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:${FRONTEND_PUBLIC_PORT:-4200}
      PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PUBLIC_PORT:-3000}
      MEDIA_BASE_URL: http://localhost:${FRONTEND_PUBLIC_PORT:-4200}/media
      MEDIA_INTERNAL_BASE_URL: http://mediamtx:8888
      RTMP_PUBLISH_URL: rtmp://localhost:1935/live
      DB_HOST: shared-postgres
      DB_PORT: 5432
      DB_USER: ${NAUGHTYBOX_DB_USER:-postgres}
      DB_PASSWORD: ${NAUGHTYBOX_DB_PASSWORD:?Set the local shared PostgreSQL password}
      DB_NAME: ${NAUGHTYBOX_DB_NAME:-naughtybox}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - '127.0.0.1:${BACKEND_PUBLIC_PORT:-3000}:3000'
    restart: unless-stopped
    networks: [dev-network]

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_started
      mediamtx:
        condition: service_started
    ports:
      - '127.0.0.1:${FRONTEND_PUBLIC_PORT:-4200}:80'
    restart: unless-stopped
    networks: [dev-network]

networks:
  dev-network:
    external: true
